---
# Build as 64-bit RISC OS
#

name: RISC OS

# Controls when the action will run. Triggers the workflow on:
#   * push on any branch.
#   * tag creation for tags beginning with a 'v'
#   * pull requests
on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ["*"]

jobs:
  build-riscos:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    container:
      image: gerph/riscos-build:latest-64bit

    outputs:
      version: ${{ steps.version.outputs.version }}
      leafname: ${{ steps.version.outputs.leafname }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6

      - name: RISC OS 64 build
        run: |
          cd RISCOS
          riscos-amu BUILD64=1 export
          riscos-amu BUILD64=1 -f MakefileCmd

      - name: RISC OS 32 build
        run: |
          cd RISCOS
          riscos-amu export
          riscos-amu -f MakefileCmd

      - name: Create archive of exports
        run: |
          mkdir -p Artifacts
          mkdir -p Artifacts/Library32
          mkdir -p Artifacts/Library64
          mkdir -p Artifacts/Lib
          cp RISCOS/aif32/Lua,ff8 Artifacts/Library32/
          cp RISCOS/aif64/Lua,ff8 Artifacts/Library64/
          cp -R $BUILD_DIR/Export/Lib/Lua Artifacts/Lib/Lua
          cd Artifacts ; riscos-zip ../Lua.zip *

      - name: Give the output a versioned name
        id: version
        run: |
          if [ -f RISCOS/VersionNum ] ; then
              version=$(sed '/MajorVersion / ! d ; s/.*MajorVersion *"\(.*\)"/\1/' RISCOS/VersionNum)
          else
              version=$(git rev-parse --short HEAD)
          fi
          echo "This is version: $version"
          leafname="Lua-$version.zip"
          mv Lua.zip "Lua-$version.zip"

          echo "version=$version" >> $GITHUB_OUTPUT
          echo "leafname=$leafname" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: riscos-build
          path: ${{ steps.version.outputs.leafname }}
        # The artifact that is downloadable from the Actions is actually a zip of the artifacts
        # that we supply. So it will be a regular Zip file containing a RISC OS Zip file.

  test-riscos:
    runs-on: ubuntu-latest
    container:
      image: gerph/riscos-build:latest-64bit
    concurrency:
      group: riscos-build-server
    needs:
      - build-riscos

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6

      - name: Download built RISC OS binary
        uses: actions/download-artifact@v8
        with:
          name: riscos-build

      - name: Decompress built binary
        run: |
          cd RISCOS
          riscos-unzip ../"${{ needs.build-riscos.outputs.leafname }}"

      - name: Run on the build service
        run: |
          cd RISCOS
          zip /tmp/source-archive.zip Library*/Lua,ff8 hanoi.lua .robuild.yaml
          riscos-build-online -A aarch64 -i /tmp/source-archive.zip -a off -t 60

  # The release only triggers when the thing that was pushed was a tag starting with 'v'
  release:
    needs:
      - build-riscos
      - test-riscos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download built RISC OS binary
        uses: actions/download-artifact@v8
        with:
          name: riscos-build

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          prerelease: false
          draft: true
          artifacts: "${{ needs.build-riscos.outputs.leafname }}"
          artifactContentType: application/zip
